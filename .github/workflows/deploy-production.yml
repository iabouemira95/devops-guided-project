name: Deploy Production

on:
  workflow_run:
    workflows:
      - Publish Image
    types:
      - completed
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to deploy
        required: true

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: deploy-production
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_KEYVAULT_NAME: ${{ secrets.AZURE_KEYVAULT_NAME }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      VM_HOST: ${{ secrets.VM_HOST }}
      VM_USER: ${{ secrets.VM_USER }}
      VM_APP_DIR: ${{ secrets.VM_APP_DIR }}
      VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
      VM_SSH_KEY_B64: ${{ secrets.VM_SSH_KEY_B64 }}

    steps:
      - name: Select image tag
        id: image-tag
        run: |
          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            image_tag="${{ inputs.image_tag }}"
          else
            short_sha="$(printf '%s' '${{ github.event.workflow_run.head_sha }}' | cut -c1-7)"
            image_tag="sha-${short_sha}"
          fi

          echo "image_tag=${image_tag}" >> "${GITHUB_OUTPUT}"
          echo "Selected image tag: ${image_tag}"

      - name: Load runtime secret fallback from GitHub Secrets
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          REGISTRY_HOST: ${{ secrets.TODO_REGISTRY_HOST }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail

          for key in POSTGRES_PASSWORD GRAFANA_ADMIN_PASSWORD REGISTRY_HOST REGISTRY_USERNAME REGISTRY_PASSWORD; do
            value="${!key}"
            if [ -n "${value}" ]; then
              echo "::add-mask::${value}"
              printf '%s=%s\n' "${key}" "${value}" >> "${GITHUB_ENV}"
            fi
          done

      - name: Azure login for Azure Key Vault access
        if: ${{ env.AZURE_CLIENT_ID != '' && env.AZURE_TENANT_ID != '' && env.AZURE_SUBSCRIPTION_ID != '' && env.AZURE_KEYVAULT_NAME != '' }}
        uses: azure/login@v1
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Read deployment secrets from Azure Key Vault
        if: ${{ env.AZURE_CLIENT_ID != '' && env.AZURE_TENANT_ID != '' && env.AZURE_SUBSCRIPTION_ID != '' && env.AZURE_KEYVAULT_NAME != '' }}
        env:
          AZURE_CORE_OUTPUT: none
          AZURE_KEYVAULT_NAME: ${{ env.AZURE_KEYVAULT_NAME }}
        uses: azure/CLI@v1
        with:
          inlineScript: |
            set -euo pipefail

            fetch_secret() {
              local secret_name="$1"
              local secret_value
              secret_value="$(az keyvault secret show --vault-name "${AZURE_KEYVAULT_NAME}" --name "${secret_name}" --query value -o tsv 2>/dev/null || true)"

              if [ -n "${secret_value}" ]; then
                echo "::add-mask::${secret_value}"
                printf '%s=%s\n' "${secret_name}" "${secret_value}" >> "${GITHUB_ENV}"
                echo "Loaded ${secret_name} from Azure Key Vault."
              else
                echo "Azure Key Vault did not return ${secret_name}. Keeping the GitHub Secrets fallback if it exists."
              fi
            }

            fetch_secret POSTGRES_PASSWORD
            fetch_secret GRAFANA_ADMIN_PASSWORD
            fetch_secret TODO_REGISTRY_HOST
            fetch_secret REGISTRY_USERNAME
            fetch_secret REGISTRY_PASSWORD

      - name: Validate deployment secret availability
        run: |
          set -euo pipefail

          missing=0

          for key in POSTGRES_PASSWORD GRAFANA_ADMIN_PASSWORD; do
            if [ -z "${!key:-}" ]; then
              echo "Missing required deployment secret: ${key}"
              missing=1
            fi
          done

          if [ -z "${REGISTRY_HOST:-}" ]; then
            echo "Missing required registry secret: REGISTRY_HOST"
            missing=1
          elif [[ "${REGISTRY_HOST}" == *.amazonaws.com ]]; then
            if { [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${AWS_SECRET_ACCESS_KEY:-}" ] || [ -z "${AWS_REGION:-}" ]; } \
              && { [ -z "${REGISTRY_USERNAME:-}" ] || [ -z "${REGISTRY_PASSWORD:-}" ]; }; then
              echo "ECR path detected from REGISTRY_HOST."
              echo "Provide AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, and AWS_REGION"
              echo "or provide REGISTRY_USERNAME and REGISTRY_PASSWORD for a pre-generated registry token."
              missing=1
            fi
          else
            for key in REGISTRY_USERNAME REGISTRY_PASSWORD; do
              if [ -z "${!key:-}" ]; then
                echo "Missing required registry secret: ${key}"
                missing=1
              fi
            done
          fi

          if [ "${missing}" -eq 1 ]; then
            echo "Provide the missing value in your secret manager or GitHub Secrets fallback."
            exit 1
          fi

      - name: Validate VM connection settings
        run: |
          set -euo pipefail

          missing=0

          for key in VM_HOST VM_USER VM_APP_DIR; do
            if [ -z "${!key:-}" ]; then
              echo "Missing required VM setting: ${key}"
              missing=1
            fi
          done

          if [ -z "${VM_SSH_KEY_B64:-}" ] && [ -z "${VM_SSH_KEY:-}" ]; then
            echo "Missing VM SSH key. Set VM_SSH_KEY_B64 or VM_SSH_KEY in GitHub Secrets."
            missing=1
          fi

          if [ "${missing}" -eq 1 ]; then
            echo "Add the missing VM settings in GitHub Secrets before running Deploy Production."
            exit 1
          fi

      - name: Show selected secret source
        run: |
          set -euo pipefail

          if [ -n "${AZURE_CLIENT_ID}" ] && [ -n "${AZURE_TENANT_ID}" ] && [ -n "${AZURE_SUBSCRIPTION_ID}" ] && [ -n "${AZURE_KEYVAULT_NAME}" ]; then
            echo "Using Azure Key Vault as the preferred runtime secret source."
          else
            echo "Using GitHub Secrets fallback for runtime secrets."
          fi

      - name: Configure AWS credentials for ECR deploys
        if: ${{ contains(env.REGISTRY_HOST, '.amazonaws.com') && env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != '' && env.AWS_REGION != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ env.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Prepare ECR login token
        if: ${{ contains(env.REGISTRY_HOST, '.amazonaws.com') && env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != '' && env.AWS_REGION != '' && env.REGISTRY_PASSWORD == '' }}
        run: |
          set -euo pipefail
          registry_password="$(aws ecr get-login-password --region "${AWS_REGION}")"
          echo "::add-mask::${registry_password}"
          printf 'REGISTRY_USERNAME=%s\n' "AWS" >> "${GITHUB_ENV}"
          printf 'REGISTRY_PASSWORD=%s\n' "${registry_password}" >> "${GITHUB_ENV}"
          echo "Generated a temporary ECR login token for this deploy run."

      - name: Deploy selected tag to VM
        env:
          IMAGE_TAG: ${{ steps.image-tag.outputs.image_tag }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          GRAFANA_ADMIN_PASSWORD: ${{ env.GRAFANA_ADMIN_PASSWORD }}
          REGISTRY_HOST: ${{ env.REGISTRY_HOST }}
          REGISTRY_USERNAME: ${{ env.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ env.REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail

          key_file="${RUNNER_TEMP}/vm-deploy-key.pem"
          ssh_config_file="${RUNNER_TEMP}/vm-ssh-config"

          if [ -n "${VM_SSH_KEY_B64:-}" ]; then
            printf '%s' "${VM_SSH_KEY_B64}" | tr -d '\r\n' | base64 --decode > "${key_file}"
            echo "Loaded VM SSH key from VM_SSH_KEY_B64."
          else
            printf '%s\n' "${VM_SSH_KEY}" | sed 's/\r$//' > "${key_file}"
            echo "Loaded VM SSH key from VM_SSH_KEY."
          fi

          chmod 600 "${key_file}"
          ssh-keygen -y -f "${key_file}" >/dev/null

          cat > "${ssh_config_file}" <<EOF
          Host vm-target
            HostName ${VM_HOST}
            User ${VM_USER}
            IdentityFile ${key_file}
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF

          ssh -F "${ssh_config_file}" vm-target "echo SSH connection to ${VM_HOST} succeeded."

          ssh -F "${ssh_config_file}" vm-target <<EOF
          export IMAGE_TAG='${IMAGE_TAG}'
          export POSTGRES_PASSWORD='${POSTGRES_PASSWORD}'
          export GRAFANA_ADMIN_PASSWORD='${GRAFANA_ADMIN_PASSWORD}'
          export REGISTRY_HOST='${REGISTRY_HOST}'
          export REGISTRY_USERNAME='${REGISTRY_USERNAME}'
          export REGISTRY_PASSWORD='${REGISTRY_PASSWORD}'
          cd '${VM_APP_DIR}'
          bash deploy/deploy.sh '${IMAGE_TAG}'
          EOF
